name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive
      - name: Build
        run: make CC=${{ matrix.cc }}
      - name: Test
        run: make CC=${{ matrix.cc }} check
